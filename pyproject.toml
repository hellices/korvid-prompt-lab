[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korvid-prompt-lab"
version = "0.1.0"
description = "Prompt optimization control plane for Korvid"
requires-python = ">=3.11"
dependencies = [
    "dspy",
    "gepa",
    "PyYAML",
]

[project.scripts]
korvid-prompt-lab = "korvid_prompt_lab.cli:main"
korvid-bridge = "korvid_prompt_lab.bridge:main"
korvid-grounding-report = "korvid_prompt_lab.round_cli:main"
korvid-campaign = "korvid_prompt_lab.campaign_cli:main"

[project.optional-dependencies]
legacy = ["korvid[agent,mcp]==0.3.0"]
dev = ["pytest", "mypy", "ruff", "korvid-prompt-lab[legacy]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
exclude = ["src/korvid_prompt_lab/native_worker\\.py$"]
# native_worker is checked separately with --python-executable pointing to
# the pinned 0.4.1 source environment; this environment covers legacy 0.3.

# Legacy write/approval bridge tests import Korvid checkout-only test modules.
[[tool.mypy.overrides]]
module = ["korvid.*", "tests.evals.*", "tests.ui.*", "httpx"]
ignore_missing_imports = true
