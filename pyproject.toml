[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korvid-prompt-lab"
version = "0.1.0"
description = "Prompt optimization control plane for Korvid"
requires-python = ">=3.11"
dependencies = [
    "dspy",
    "gepa",
    "PyYAML",
    "httpx",
    "litellm",
]

[project.scripts]
korvid-prompt-lab = "korvid_prompt_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
exclude = [
    "src/korvid_prompt_lab/upstream_worker\\.py$",
    "tests/test_upstream_worker\\.py$",
]
# The source worker and its upstream tests are checked separately against
# the prepared Korvid source environment. The control plane does not install Korvid.
