name: Grounding Round

# Trust boundary
# --------------
# This definition executes from the repository default branch only.  The Prompt
# Lab revision that actually runs is the reviewed commit named by the required
# `prompt_lab_ref` input, which must be an exact 40-hex commit SHA.  Dispatch
# inputs are validated before any credential is used, and no input is ever
# interpolated into shell or JavaScript source text: values reach scripts only
# through `env:` and are read at runtime.

"on":
  workflow_dispatch:
    inputs:
      prompt_lab_ref:
        description: "Prompt Lab commit SHA to ground (exact 40-hex commit SHA)"
        required: true
        type: string
      korvid_ref:
        description: "Korvid commit SHA to check out (exact 40-hex commit SHA)"
        required: true
        type: string
        default: "fc7eece2adb66a5b2a18d378bdfd7503ddbdd2ca"
      model:
        description: "Ollama model tag to evaluate"
        type: choice
        options:
          - "qwen3:0.6b"
          - "qwen3:1.7b"
          - "qwen3:4b"
          - "qwen3:8b"
          - "qwen3:14b"
        default: "qwen3:1.7b"
      round_type:
        description: "Round type"
        type: choice
        options:
          - "evaluate"
          - "optimize-evaluate"
        default: "evaluate"
      candidate:
        description: "Path to candidate YAML (relative to the Prompt Lab checkout)"
        required: true
        type: string
        default: "examples/candidates/shipped-small.yaml"
      pr_number:
        description: "Pull request number for the sticky comment (leave blank to skip)"
        required: false
        type: number

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: aks-grounding-${{ github.repository }}
  cancel-in-progress: false

jobs:
  grounding:
    name: Grounding round
    runs-on: korvid-runners
    environment: aks-grounding

    env:
      # One artifact root, derived once.  `artifacts/` is gitignored, so live
      # evidence never lands in a tracked path, and every consumer below refers
      # to this same safe-evidence directory.
      GROUNDING_ARTIFACT_ROOT: ${{ github.workspace }}/prompt-lab/artifacts/grounding-round
      GROUNDING_SAFE_EVIDENCE_DIR: ${{ github.workspace }}/prompt-lab/artifacts/grounding-round/safe-evidence

    steps:
      # -----------------------------------------------------------------------
      # 1. Validate every dispatch input before any credential is used
      # -----------------------------------------------------------------------
      - name: Validate dispatch inputs
        shell: bash
        env:
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMPT_LAB_REF: ${{ inputs.prompt_lab_ref }}
          KORVID_REF: ${{ inputs.korvid_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE: ${{ inputs.candidate }}
          ROUND_TYPE: ${{ inputs.round_type }}
        run: |
          set -Eeuo pipefail

          if [[ "$WORKFLOW_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::grounding rounds must be dispatched from the default branch"
            exit 1
          fi

          if [[ ! "$PROMPT_LAB_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::prompt_lab_ref must be an exact 40-hex commit SHA, not a branch or tag"
            exit 1
          fi

          if [[ ! "$KORVID_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::korvid_ref must be an exact 40-hex commit SHA, not a branch or tag"
            exit 1
          fi

          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::pr_number must be a positive integer or blank"
            exit 1
          fi

          if [[ ! "$CANDIDATE" =~ ^[A-Za-z0-9._/-]+$ ]] \
            || [[ "$CANDIDATE" == /* ]] \
            || [[ "$CANDIDATE" == *".."* ]]; then
            echo "::error::candidate must be a relative path inside the Prompt Lab checkout"
            exit 1
          fi

          case "$ROUND_TYPE" in
            evaluate|optimize-evaluate) ;;
            *) echo "::error::unsupported round type"; exit 1 ;;
          esac

      # -----------------------------------------------------------------------
      # 2. Check out the approved Prompt Lab commit (read-only GITHUB_TOKEN)
      # -----------------------------------------------------------------------
      - name: Checkout Prompt Lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.prompt_lab_ref }}
          path: prompt-lab
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 3. Obtain a Korvid app token downscoped to read-only contents
      # -----------------------------------------------------------------------
      - name: Get Korvid app token
        id: korvid-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e  # v2.0.6
        with:
          app-id: ${{ vars.KORVID_APP_ID }}
          private-key: ${{ secrets.KORVID_APP_PRIVATE_KEY }}
          repositories: korvid
          permission-contents: read

      # -----------------------------------------------------------------------
      # 4. Check out the pinned Korvid revision
      # -----------------------------------------------------------------------
      - name: Checkout Korvid at pinned ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/korvid
          ref: ${{ inputs.korvid_ref }}
          token: ${{ steps.korvid-token.outputs.token }}
          path: korvid
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 5. Azure OIDC login (no client secret)
      # -----------------------------------------------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302  # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # 6. Python toolchain
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
        with:
          version: "latest"

      # -----------------------------------------------------------------------
      # 7. Install Prompt Lab into an environment outside both checkouts
      # -----------------------------------------------------------------------
      - name: Install Prompt Lab
        working-directory: prompt-lab
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prompt-lab-uv-env
        run: |
          set -Eeuo pipefail
          uv venv --python 3.12 "$UV_PROJECT_ENVIRONMENT"
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" .
          test -x "$UV_PROJECT_ENVIRONMENT/bin/korvid-prompt-lab"
          test -x "$UV_PROJECT_ENVIRONMENT/bin/korvid-grounding-report"
          printf '%s\n' "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      # -----------------------------------------------------------------------
      # 8. Provision the Korvid uv environment out of tree
      #
      # The bridge launches its worker with `uv run --project <korvid> --no-sync`,
      # which needs a complete environment for that checkout.  The checkout stays
      # read-only: the environment is built at an absolute path under the runner
      # temp directory, the lockfile is never rewritten, and the step fails if
      # provisioning modified a single tracked file.
      # -----------------------------------------------------------------------
      - name: Provision Korvid uv environment out of tree
        working-directory: korvid
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/korvid-uv-env
        run: |
          set -Eeuo pipefail
          uv sync --python 3.12 --frozen --dev --all-extras --no-editable
          test -x "$UV_PROJECT_ENVIRONMENT/bin/python"
          test ! -e .venv
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::provisioning modified the read-only Korvid checkout"
            git status --porcelain
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 9. Run the grounding orchestrator
      # -----------------------------------------------------------------------
      - name: Run grounding round
        working-directory: prompt-lab
        shell: bash
        env:
          GROUNDING_MODEL: ${{ inputs.model }}
          GROUNDING_CANDIDATE: ${{ inputs.candidate }}
          GROUNDING_ROUND_TYPE: ${{ inputs.round_type }}
          # Reflection credentials exist only for optimize rounds; an
          # evaluate-only round never materialises them.
          GROUNDING_REFLECTION_MODEL: ${{ inputs.round_type == 'optimize-evaluate' && vars.GROUNDING_REFLECTION_MODEL || '' }}
          GROUNDING_REFLECTION_CREDENTIAL: ${{ inputs.round_type == 'optimize-evaluate' && secrets.GROUNDING_REFLECTION_CREDENTIAL || '' }}
          KORVID_SOURCE_ROOT: ${{ github.workspace }}/korvid
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/korvid-uv-env
          PROMPT_LAB_REVISION: ${{ inputs.prompt_lab_ref }}
          KORVID_REVISION: ${{ inputs.korvid_ref }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/run-grounding-round.sh

      # -----------------------------------------------------------------------
      # 10. Append the safe round summary to the Job Summary
      # -----------------------------------------------------------------------
      - name: Append round summary to Job Summary
        if: always() && hashFiles('prompt-lab/artifacts/grounding-round/safe-evidence/round-summary.md') != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          cat "$GROUNDING_SAFE_EVIDENCE_DIR/round-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 11. Upload only the safe-evidence package (never raw live artifacts)
      # -----------------------------------------------------------------------
      - name: Upload safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: safe-evidence
          path: prompt-lab/artifacts/grounding-round/safe-evidence/
          retention-days: 30
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # 12. Sticky PR comment (optional, only when pr_number is provided)
      # -----------------------------------------------------------------------
      - name: Update sticky PR comment
        if: always() && inputs.pr_number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          GROUNDING_MODEL: ${{ inputs.model }}
          GROUNDING_CANDIDATE: ${{ inputs.candidate }}
          GROUNDING_PR_NUMBER: ${{ inputs.pr_number }}
          GROUNDING_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GROUNDING_SUMMARY_PATH: ${{ env.GROUNDING_SAFE_EVIDENCE_DIR }}/round-summary.md
        with:
          script: |
            const fs = require('fs');

            const model = process.env.GROUNDING_MODEL || '';
            const candidate = process.env.GROUNDING_CANDIDATE || '';
            const runUrl = process.env.GROUNDING_RUN_URL || '';
            const summaryPath = process.env.GROUNDING_SUMMARY_PATH || '';
            const rawPrNumber = (process.env.GROUNDING_PR_NUMBER || '').trim();

            if (!/^[1-9][0-9]{0,9}$/.test(rawPrNumber)) {
              core.setFailed('pr_number must be a positive integer');
              return;
            }
            const prNumber = Number(rawPrNumber);

            // Only a pull request in this repository may be commented on, so a
            // dispatch can never point round evidence at an arbitrary issue.
            try {
              await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
            } catch (error) {
              core.setFailed('pr_number ' + prNumber + ' is not a pull request in this repository');
              return;
            }

            const marker = '<!-- korvid-grounding:' + model + ':' + candidate + ' -->';

            let summaryBody = '';
            if (summaryPath && fs.existsSync(summaryPath)) {
              summaryBody = fs.readFileSync(summaryPath, 'utf8');
            }

            const body = [
              marker,
              '',
              summaryBody,
              '',
              '---',
              '[View workflow run](' + runUrl + ')',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
